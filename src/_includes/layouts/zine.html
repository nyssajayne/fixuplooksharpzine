<!doctype html>
<html lang="en-US" class="bg-color-one">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <meta charset="utf-8" />

        <title>Fix Up Look Sharp | Mending Zine & Happy Hour</title>

        <main>
            <article data-order="page-a" class="print-only"><p class="no-print">this page intentionally left blank</p></article>
            <article data-order="page-b" class="print-only"><p class="no-print">this page intentionally left blank</p></article>
            {% include 'partials/page.html' %}

        <footer>
            <img src="/assets/buttons.svg" alt="Fresh buttons">
